[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template-personalizer"
version = "0.1.0"
description = "Automated personalization of FastReport (.fr3) templates by replacing relational references with pre-configured values"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pytest"
]

[project.scripts]
template-personalizer = "template_personalizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
